name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Get absolute path of Quartz cache
        id: quartz-cache-path
        run: echo "dir=$(pwd)/.quartz-cache" >> $GITHUB_OUTPUT
      - name: Retrieve Quartz cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.quartz-cache-path.outputs.dir }}
          key: ${{ runner.os }}-quartz-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-quartz-cache-
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
